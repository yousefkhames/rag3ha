<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b2e">
<title>Rag3ha | رجّعها, never miss a return window</title><meta name="description" content="Paste a purchase receipt, get the return deadline. Private, free, runs in your browser.">

<header role="banner"><div class="brand"><img src="logo.svg" alt="" width="40" height="40"><div><h1><b>Rag3ha</b> <span class="ar" lang="ar">رجّعها</span></h1><small data-i="tag"></small></div></div>
<div class="hbtn"><button class="ghost" id="theme" aria-label="Theme" title="Theme">◐</button> <button id="lang" aria-label="Switch language / تغيير اللغة"></button></div></header>
<main>
<section class="card" id="add"><h2 data-i="add"></h2><p class="muted" id="priv" data-i="priv"></p>
<label for="txt" class="sr" data-i="ph"></label><textarea id="txt" rows="7" data-ip="ph" aria-describedby="priv"></textarea>
<div class="row"><label for="from" class="sr" data-i="from"></label><input id="from" data-ip="from" autocomplete="off"><button class="ghost" id="sample" data-i="sample"></button><label class="ghost btn" for="file" data-i="file"></label><input type="file" id="file" hidden accept=".eml,.txt,text/plain,message/rfc822"><button id="parse" data-i="parse"></button></div></section>
<section class="card hide" id="review" aria-labelledby="h-rev" tabindex="-1"><h2 id="h-rev" data-i="check"></h2><div class="grid">
<label><span data-i="store"></span><input id="f-store"></label><label><span data-i="item"></span><input id="f-item"></label>
<label><span data-i="date"></span><input type="date" id="f-date"></label><label><span data-i="win"></span><input type="number" id="f-win" min="1" max="730"></label>
<label><span data-i="amt"></span><input id="f-amt"></label><label><span data-i="ord"></span><input id="f-ord"></label></div>
<p class="muted" id="src"></p><div class="row"><button id="save" data-i="save"></button><button class="ghost" id="cancel" data-i="cancel"></button></div></section>
<section class="card" id="list"><div class="top"><h2 data-i="list"></h2><div class="row"><button class="ghost" id="ics" data-i="ics"></button><button class="ghost" id="copy" data-i="copy"></button><button class="ghost" id="exp" data-i="exp"></button><button class="ghost" id="csv" data-i="csv"></button><label class="ghost btn" for="imp" data-i="imp"></label><input type="file" id="imp" hidden accept=".json"></div></div>
<p class="muted" id="stats"></p><div class="row remrow"><button class="ghost" id="rem" data-i="rem"></button><label class="sr" for="remd">Days before</label><select id="remd"><option value="1">1</option><option value="3">3</option><option value="7">7</option></select></div><label class="sr" for="q" data-i="qph"></label><input id="q" type="search" data-ip="qph" autocomplete="off"><div class="tabs"><button class="ghost" data-f="active" data-i="fa"></button><button class="ghost" data-f="done" data-i="fd"></button><button class="ghost" data-f="all" data-i="fl"></button></div><div id="items" role="list" aria-live="polite"></div><div id="toast" class="toast hide" role="status" aria-live="assertive"></div><p class="muted hide" id="empty" data-i="empty"></p></section>
<section class="card" id="how"><h2 data-i="howh"></h2><ol><li data-i="h1"></li><li data-i="h2"></li><li data-i="h3"></li></ol></section>
</main>
